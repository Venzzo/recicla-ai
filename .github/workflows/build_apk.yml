name: Build RECICLA.AI Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Model Assets
        run: |
          ls -lh assets/models/best.onnx
          ls -lh assets/data/materials_catalog.json

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recicla-ai-universal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  check-ios:
    name: Prepare & Validate iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign for Local Testing/IPA)
        run: flutter build ios --no-codesign
